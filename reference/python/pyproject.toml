[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authr-protocol"
version = "0.1.0"
description = "AuthR (Authorship Representation) — reference implementation of the v0.1 protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Steve Tout", email = "steve@identient.ai" },
]
keywords = ["identity", "authentication", "authorization", "agents", "ai", "protocol", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/identient/authr"
Documentation = "https://github.com/identient/authr/blob/main/spec/AUTHR-v0.1.md"
Repository = "https://github.com/identient/authr"
Issues = "https://github.com/identient/authr/issues"
Changelog = "https://github.com/identient/authr/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/authr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
